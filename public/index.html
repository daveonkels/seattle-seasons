<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seattle Seasons — A Helpful Guide for New Arrivals</title>
<meta name="description" content="An interactive field guide to the 14 unofficial seasons of Seattle, Washington. Scrub through the year.">
<meta property="og:title" content="Seattle Seasons">
<meta property="og:description" content="An interactive field guide to the 14 unofficial seasons of Seattle, Washington.">

<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="shortcut icon" href="./favicon.ico">
<link rel="manifest" href="./site.webmanifest">
<meta name="theme-color" content="#243154">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@300;400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=nippo@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body data-season="dark-wet" data-loaded="false">

<canvas id="scene" aria-hidden="true"></canvas>
<div id="drench" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>

<header class="chrome">
  <div class="chrome__corner chrome__corner--tl">
    <div class="chrome__city">
      <span class="dot" aria-hidden="true"></span>
      <span>City of Seattle</span>
    </div>
    <h1 class="chrome__title"><span class="reveal-word">Seattle</span> <span class="reveal-word">Seasons</span></h1>
    <p class="chrome__subtitle">A Helpful Guide for New Arrivals</p>
  </div>

  <div class="chrome__corner chrome__corner--tr">
    <button class="advisory" id="advisory-btn" type="button" aria-label="Jump the timeline to today">
      <span class="advisory__main" aria-live="polite">
        <span class="advisory__dot" aria-hidden="true"></span>
        <span class="advisory__label">Right now</span>
        <span class="advisory__season" id="right-now-season">—</span>
        <span class="advisory__week" id="right-now-week">WK —— / 52</span>
      </span>
      <span class="advisory__cta" aria-hidden="true">
        <span class="advisory__cta-arrow">↺</span>
        <span>Jump to today</span>
      </span>
    </button>
    <div class="micro-controls">
      <button class="micro-btn" id="audio-toggle" type="button" aria-pressed="false"
              data-tip="Ambient sound" aria-label="Toggle ambient audio">
        <span class="micro-eq" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <button class="micro-btn" id="share-btn" type="button"
              data-tip="Share this season" aria-label="Share this season">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<svg class="skyline" aria-hidden="true" viewBox="0 0 1200 120" preserveAspectRatio="xMidYEnd meet">
  <!-- Olympic / Cascade horizon -->
  <path d="M0,90 L80,70 L160,82 L240,60 L320,72 L420,50 L520,68 L620,55 L720,78 L820,65 L920,80 L1020,72 L1100,85 L1200,75 L1200,120 L0,120 Z" fill="currentColor" opacity="0.35"/>
  <!-- Mid skyline -->
  <path d="M0,95 L60,95 L60,80 L120,80 L120,90 L180,90 L180,70 L240,70 L240,88 L320,88 L320,75 L380,75 L380,92 L460,92 L460,82 L520,82 L520,95 L1200,95 L1200,120 L0,120 Z" fill="currentColor" opacity="0.55"/>
  <!-- Space Needle -->
  <g fill="currentColor">
    <rect x="640" y="50" width="4" height="55"/>
    <ellipse cx="642" cy="48" rx="22" ry="6"/>
    <path d="M634,52 L650,52 L646,60 L638,60 Z"/>
    <rect x="640" y="20" width="4" height="20"/>
    <circle cx="642" cy="18" r="2"/>
  </g>
  <!-- Foreground buildings -->
  <path d="M700,105 L700,82 L740,82 L740,75 L780,75 L780,88 L820,88 L820,78 L860,78 L860,95 L920,95 L920,85 L980,85 L980,92 L1040,92 L1040,80 L1100,80 L1100,95 L1200,95 L1200,120 L700,120 Z" fill="currentColor" opacity="0.75"/>
  <!-- Mt Rainier silhouette, far right -->
  <path d="M820,95 L860,55 L885,68 L905,42 L935,72 L975,90 L820,95 Z" fill="currentColor" opacity="0.45"/>
</svg>

<main class="content" id="content">
  <div class="content__head">
    <p class="content__subtitle" id="season-subtitle"></p>
    <h2 class="content__title" id="season-title"></h2>
  </div>
  <div class="content__body-wrap">
    <p class="content__body" id="season-body"></p>
    <p class="content__footnote" id="season-footnote"></p>
  </div>

  <aside class="stamp" id="season-stamp" aria-label="What to expect">
    <div class="stamp__seal" aria-hidden="true">
      <svg viewBox="0 0 120 120" class="stamp__ring">
        <defs>
          <path id="stamp-curve-top" d="M 12,60 a 48,48 0 0 1 96,0"/>
          <path id="stamp-curve-bot" d="M 16,60 a 44,44 0 0 0 88,0"/>
        </defs>
        <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="60" cy="60" r="46" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
        <text class="stamp__curve-text" font-size="9">
          <textPath href="#stamp-curve-top" startOffset="50%" text-anchor="middle">CITY OF SEATTLE · PUBLIC ADVISORY ·</textPath>
        </text>
        <text class="stamp__curve-text" font-size="9">
          <textPath href="#stamp-curve-bot" startOffset="50%" text-anchor="middle">FOR NEW ARRIVALS · ANNUAL CYCLE ·</textPath>
        </text>
      </svg>
      <span class="stamp__big">EXPECT</span>
    </div>
    <p class="stamp__text" id="stamp-text"></p>
  </aside>
</main>

<footer class="scrubber">
  <div class="scrubber__legend" aria-hidden="true">
    <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span>
    <span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span>
  </div>
  <div class="scrubber__track" id="scrubber-track">
    <div class="scrubber__ticks" id="scrubber-ticks" aria-hidden="true"></div>
    <div class="scrubber__segments" id="scrubber-segments" aria-hidden="true"></div>
    <div class="scrubber__today" id="scrubber-today" aria-hidden="true">
      <span class="scrubber__today-label">Today</span>
      <span class="scrubber__today-mark"></span>
      <span class="scrubber__today-line"></span>
    </div>
    <div class="scrubber__handle" id="scrubber-handle"
         role="slider"
         tabindex="0"
         aria-label="Year scrubber"
         aria-valuemin="0" aria-valuemax="51" aria-valuenow="0"
         aria-valuetext="The Dark Wet, week 1">
      <span class="scrubber__handle-flag" id="scrubber-flag">The Dark Wet</span>
    </div>
  </div>
  <div class="scrubber__hint" id="scrubber-hint">Drag · scroll · or ← →</div>
  <a class="credit" href="https://onk.io" target="_blank" rel="noopener noreferrer">
    <span>Site by Dave</span>
    <span class="credit__arrow" aria-hidden="true">↗</span>
  </a>
</footer>

<div class="hint-cursor" id="hint-cursor" aria-hidden="true"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
